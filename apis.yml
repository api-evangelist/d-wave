    type: Examples
  description: >-
    List, inspect, and discover D-Wave solvers available to the authenticated project, including quantum
    annealing QPU samplers (Advantage, Advantage2) and Leap hybrid samplers (BQM, CQM, DQM, NL). Solvers
    carry capability metadata (qubit count, topology, supported problem types, parameters, properties)
    so clients can match a workload to the correct sampler. Versioned via vendor media type `application/vnd.dwave.sapi.solver-definition+json;version~=3.0`.
- aid: d-wave:d-wave-problems-api
  name: D-Wave Solver API (SAPI) - Problems
  tags:
  - Quantum Computing
  - Quantum Annealing
  - Problems
  - Sampling
  - Optimization
  humanURL: https://docs.dwavequantum.com/en/latest/ocean/api_ref_cloud/index.html
  baseURL: https://cloud.dwavesys.com/sapi/v2
  properties:
  - url: https://docs.dwavequantum.com/en/latest/ocean/api_ref_cloud/index.html
    type: Documentation
  - url: openapi/d-wave-problems-api-openapi.yml
    type: OpenAPI
  - url: json-schema/d-wave-problem-schema.json
    type: JSONSchema
  - url: json-schema/d-wave-problem-answer-schema.json
    type: JSONSchema
  - url: examples/d-wave-submit-problem-example.json
    type: Examples
  - url: examples/d-wave-problem-status-example.json
    type: Examples
  description: >-
    Submit, monitor, retrieve, and cancel quantum and hybrid problem jobs. Supports the canonical problem
    types ising, qubo, bqm, cqm, dqm, and nl with three encoding formats (qp, bq, ref). Problems flow
    through PENDING > IN_PROGRESS > COMPLETED | FAILED | CANCELLED terminal states. Endpoints support
    blocking submit (single problem), batch async submit (multi-problem), short status polling, full-info
    retrieval, answer download (inline or binary-ref via SAPI-token), problem messages, and single/bulk
    cancel. Up to 1,000 problem IDs per status batch.
